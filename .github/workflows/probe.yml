name: Probe data sources
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for ua in "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36" "curl/8.5.0" "python-urllib/3.12"; do
          for u in "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard?dates=20261018" \
                   "https://site.web.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard?dates=20261018" \
                   "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/summary?event=401879254" \
                   "https://sports.core.api.espn.com/v2/sports/soccer/leagues/eng.1/events?dates=20261018&limit=50" ; do
            echo "== [$ua] $u"
            curl -sS -A "$ua" -o body -w "HTTP %{http_code} size %{size_download}\n" "$u"
            head -c 200 body; echo
          done; done
